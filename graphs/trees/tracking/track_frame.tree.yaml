# Tracking::Track() after the discontinuity checks: initialize, or track an initialized map; then the
# trajectory entry and the per-frame outputs.
version: 1
inputs:
  inertial: { type: fw/bool }
  params:   { type: OrbTrackingParams }
  mapper:   { type: tracking/MapperStatus }
  vocabulary: { type: map/Vocabulary }
outputs:
  state:      { type: tracking/State }
  pose:       { type: fw/PoseStamped }
  map_to_odom: { type: fw/TransformStamped }
  tracking:   { type: tracking/Status }
  atlas_edits: { type: tracking/AtlasEdits }
  mapper_cmd: { type: tracking/MapperCommand }
resources:   # the parent's of the same name
  tracker:    { type: tracking/Tracker }
root:
  Sequence:
    children:
      # NO_IMAGES_YET -> NOT_INITIALIZED, SetNewBias (frame.imu by its bias Jacobians), the IMU since the last
      # keyframe (concatenation), map change index
      - begin_frame: { state: "{state}" }
      - IfThenElse:
          children:
            - state_is: { state: "{state}", value: NOT_INITIALIZED }
            - SubTree: { tree: trees/tracking/initialize.tree.yaml, name: initialize,
                         state: "{state}", atlas_edits: "{atlas_edits}" }
            - SubTree: { tree: trees/tracking/track.tree.yaml, name: track, inertial: "{inertial}", vocabulary: "{vocabulary}",
                         params: "{params}", mapper: "{mapper}", state: "{state}",
                         atlas_edits: "{atlas_edits}", mapper_cmd: "{mapper_cmd}" }
      # mlRelativeFramePoses... (OK / RECENTLY_LOST), pose and status out
      - publish_frame: { state: "{state}", pose: "{pose}", map_to_odom: "{map_to_odom}", tracking: "{tracking}" }
