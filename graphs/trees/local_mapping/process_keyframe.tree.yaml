# One round of LocalMapping::Run() for the queue's first keyframe. local_bundle_adjustment and initialize_imu
# return RUNNING while ba_solver computes; the rest is done in the tick.
version: 1
inputs:
  inertial:  { type: fw/bool }
  tracking:  { type: tracking/Status }
  ba_result: { type: ba/Result }
outputs:
  mapper:        { type: tracking/MapperStatus }
  ba_problem:    { type: ba/Problem }
  loop_keyframe: { type: map/KeyFrameRef }
resources:   # the parent's of the same name
  atlas:        { type: map/Atlas }
  local_mapper: { type: local_mapping/LocalMapper }
  vocabulary:   { type: map/Vocabulary }
root:
  Sequence:
    children:
      - process_new_keyframe: {}
      - map_point_culling: {}
      - create_new_map_points: { tracking: "{tracking}" }
      # if(!CheckNewKeyFrames()) SearchInNeighbors()
      - ForceSuccess:
          child:
            Sequence:
              children:
                - queue_empty: {}
                - search_in_neighbors: {}
      # if(!CheckNewKeyFrames() && !stopRequested())
      - ForceSuccess:
          child:
            Sequence:
              children:
                - ready_for_local_ba: {}
                - ForceSuccess:
                    child:
                      Sequence:
                        children:
                          - enough_keyframes_for_ba: {}
                          - LocalBundleAdjustment: { name: local_bundle_adjustment, inertial: "{inertial}", tracking: "{tracking}",
                                                     ba_result: "{ba_result}", ba_problem: "{ba_problem}",
                                                     mapper: "{mapper}" }
                - ForceSuccess:
                    child:
                      Sequence:
                        children:
                          - is_inertial_uninitialized: { inertial: "{inertial}" }
                          - InitializeImu: { name: initialize_imu, prior_g: 1e2, prior_a: 1e5, fiba: true,
                                             ba_result: "{ba_result}", ba_problem: "{ba_problem}",
                                             mapper: "{mapper}" }
                - keyframe_culling: {}
                # VIBA 1 and 2 (mTinit < 50, inertial, IMU initialized, tracking OK)
                - ForceSuccess:
                    child:
                      Fallback:
                        children:
                          - Sequence:
                              children:
                                - begin_inertial_ba: { name: begin_viba1, stage: 1, inertial: "{inertial}",
                                                       tracking: "{tracking}" }
                                - InitializeImu: { name: viba1, prior_g: 1.0, prior_a: 1e5, fiba: true,
                                                   ba_result: "{ba_result}", ba_problem: "{ba_problem}",
                                                   mapper: "{mapper}" }
                          - Sequence:
                              children:
                                - begin_inertial_ba: { name: begin_viba2, stage: 2, inertial: "{inertial}",
                                                       tracking: "{tracking}" }
                                - InitializeImu: { name: viba2, prior_g: 0.0, prior_a: 0.0, fiba: true,
                                                   ba_result: "{ba_result}", ba_problem: "{ba_problem}",
                                                   mapper: "{mapper}" }
      - send_to_loop_closing: { loop_keyframe: "{loop_keyframe}" }
      - reset_if_requested: {}
