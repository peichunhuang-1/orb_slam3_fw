# ORB-SLAM3 local mapping (KB8 stereo / stereo-inertial): LocalMapping::Run() driven by ticks instead of a thread.
# Ticks: atlas edits from tracking (InsertKeyFrame, resets), a command from tracking (interrupt BA), and the
# result of an optimization ba_solver computed outside the lock (wake), and loop closing's changes (wake).
# Design: algorithms/orb_local_mapping/docs/DESIGN.md
version: 1
inputs:
  atlas_edits: { type: tracking/AtlasEdits, mode: trigger, queue: { depth: 16, policy: drop_oldest } }
  mapper_cmd: { type: tracking/MapperCommand, mode: trigger, queue: { depth: 8, policy: drop_oldest } }
  ba_result:  { type: ba/Result, mode: wake, queue: { depth: 2, policy: drop_oldest } }
  loop_result: { type: loop_closing/LoopResult, mode: wake, queue: { depth: 16, policy: drop_oldest } }  # loop closing's changes
  tracking:   { type: tracking/Status }             # latest: tracking's state and inliers (mpTracker)
  params:     { type: OrbTrackingParams }           # latest: the sensor
  vocabulary: { type: map/Vocabulary }             # latest: ComputeBoW (orb_vocabulary:// plugin)
outputs:
  mapper:        { type: tracking/MapperStatus }    # -> tracking.mapper
  ba_problem:    { type: ba/Problem }               # -> ba_solver.problem
  loop_keyframe: { type: loop_closing/LoopKeyFrame } # -> loop_closing.keyframe
resources:
  atlas:        { type: map/Atlas }                 # shared with tracking
  local_mapper: { type: local_mapping/LocalMapper } # LocalMapping's members
blackboard:
  inertial: { type: fw/bool, init: false }          # mbInertial, set by read_params from params.sensor
root:
  ReactiveSequence:
    children:
      # Every tick, even while an optimization is running further down
      - SubTree: { tree: trees/local_mapping/receive_inputs.tree.yaml, name: receive_inputs, atlas_edits: "{atlas_edits}",
                   mapper_cmd: "{mapper_cmd}", loop_result: "{loop_result}", params: "{params}", inertial: "{inertial}", mapper: "{mapper}" }
      # Run()'s while(1): one keyframe per round, in this tick, until the queue is empty or a step waits
      - ForceSuccess:
          child:
            Repeat:
              num_cycles: -1
              child:
                Sequence:
                  children:
                    - has_new_keyframe: {}
                    - SubTree: { tree: trees/local_mapping/process_keyframe.tree.yaml, name: process_keyframe, vocabulary: "{vocabulary}",
                                 inertial: "{inertial}", tracking: "{tracking}", ba_result: "{ba_result}",
                                 mapper: "{mapper}", ba_problem: "{ba_problem}", loop_keyframe: "{loop_keyframe}" }
      - mapper_idle: { mapper: "{mapper}" }
